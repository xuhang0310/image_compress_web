<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 绘图 - 图片工具箱</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/ai-draw.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="ai-header">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i class="fas fa-palette"></i> AI 绘图 - 图片工具箱</h1>
                <a href="index.html" class="btn btn-light">
                    <i class="fas fa-arrow-left"></i> 返回主页
                </a>
            </div>
        </div>

        <!-- Mode Tabs -->
        <div class="ai-tabs">
            <div class="tab active" data-tab="txt2img">
                <i class="fas fa-font"></i> 文生图
            </div>
            <div class="tab" data-tab="img2img">
                <i class="fas fa-image"></i> 以图生图
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <!-- 图片上传区 (仅 img2img 模式显示) -->
                <div id="uploadAreaContainer" style="display: none;">
                    <div class="img2img-upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p class="upload-text">点击上传或拖拽图片到此处</p>
                        <p class="upload-hint">支持 JPG、PNG、BMP、WEBP 格式</p>
                        <input type="file" id="img2imgFileInput" accept="image/*" style="display: none;">
                    </div>

                    <!-- 图片预览 -->
                    <div class="image-preview-container" id="imagePreviewContainer">
                        <div class="image-preview-wrapper">
                            <img id="imagePreview" src="" alt="预览">
                            <button type="button" class="image-preview-remove" id="removeImageBtn">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 重绘强度 -->
                    <div class="strength-slider-container parameter-group">
                        <label for="strengthSlider" class="form-label">重绘强度：<span id="strengthValue">0.75</span></label>
                        <div class="slider-with-value">
                            <input type="range" class="form-range" id="strengthSlider" min="0" max="1" value="0.75" step="0.05">
                        </div>
                        <div class="strength-indicator">
                            <span>保留原图</span>
                            <span>完全重绘</span>
                        </div>
                        <span class="parameter-hint">值越高，生成结果越不同于原图</span>
                    </div>
                </div>

                <!-- 提示词输入 -->
                <div class="prompt-area">
                    <label for="promptInput" class="form-label">提示词 <span class="text-danger">*</span></label>
                    <textarea class="form-control prompt-textarea" id="promptInput" placeholder="描述你想要生成的图像，例如：一只可爱的猫咪坐在草地上，阳光明媚，高清画质"></textarea>

                    <div class="negative-prompt">
                        <label for="negativePromptInput" class="form-label">反向提示词</label>
                        <input type="text" class="form-control" id="negativePromptInput" placeholder="描述不想要的内容，例如：模糊，低质量，变形">
                    </div>
                </div>

                <!-- 参数设置 -->
                <div class="parameter-grid">
                    <!-- 图片尺寸 -->
                    <div class="parameter-group">
                        <label class="form-label">图片尺寸</label>
                        <div class="size-options" id="sizeOptions">
                            <div class="size-btn active" data-size="1024x1024">1024×1024</div>
                            <div class="size-btn" data-size="960x1280">960×1280</div>
                            <div class="size-btn" data-size="768x1024">768×1024</div>
                            <div class="size-btn" data-size="720x1440">720×1440</div>
                            <div class="size-btn" data-size="720x1280">720×1280</div>
                        </div>
                        <span class="parameter-hint">选择生成图片的分辨率</span>
                    </div>

                    <!-- 采样步数 -->
                    <div class="parameter-group">
                        <label for="stepsSlider" class="form-label">采样步数：<span id="stepsValue">20</span></label>
                        <div class="slider-with-value">
                            <input type="range" class="form-range" id="stepsSlider" min="1" max="50" value="20">
                        </div>
                        <span class="parameter-hint">步数越多细节越好，但速度越慢</span>
                    </div>

                    <!-- 引导系数 -->
                    <div class="parameter-group">
                        <label for="cfgSlider" class="form-label">引导系数 (CFG): <span id="cfgValue">7.5</span></label>
                        <div class="slider-with-value">
                            <input type="range" class="form-range" id="cfgSlider" min="1" max="20" value="7.5" step="0.5">
                        </div>
                        <span class="parameter-hint">值越高越遵循提示词</span>
                    </div>

                    <!-- 随机种子 -->
                    <div class="parameter-group">
                        <label for="seedInput" class="form-label">随机种子</label>
                        <div class="seed-control">
                            <input type="number" class="form-control" id="seedInput" placeholder="留空表示随机">
                            <button class="btn btn-outline-secondary" id="randomSeedBtn">
                                <i class="fas fa-random"></i>
                            </button>
                        </div>
                        <span class="parameter-hint">相同种子可复现结果</span>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button class="btn generate-btn mt-4" id="generateBtn">
                    <i class="fas fa-magic"></i> 开始生成
                </button>

                <!-- 加载状态 -->
                <div class="loading-container" id="loadingContainer">
                    <div class="loading-spinner"></div>
                    <p class="loading-text" id="loadingText">正在生成中，请稍候...</p>
                </div>

                <!-- 错误信息 -->
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorText"></span>
                </div>

                <!-- 结果展示 -->
                <div class="result-gallery" id="resultGallery">
                    <div class="result-image-container">
                        <img id="resultImage" src="" alt="生成结果" class="result-image img-fluid">
                        <div class="result-actions">
                            <button class="btn btn-outline-primary" id="downloadBtn">
                                <i class="fas fa-download"></i> 下载图片
                            </button>
                            <button class="btn btn-outline-secondary" id="newGenerationBtn">
                                <i class="fas fa-redo"></i> 新生成
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
        <div id="toastAlert" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/modules/ai-draw.js"></script>
</body>
</html>
